name: Build geoip

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 */3 * *'
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
      - "release/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Сборка публикуется force-push'ем в ветку release, поэтому параллельные запуски
# (schedule + push) не должны идти одновременно.
concurrency:
  group: build-geoip
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DIRECT_URL: https://raw.githubusercontent.com/hydraponique/roscomvpn-geoip/refs/heads/release/text/direct.txt
      PRIVATE_URL: https://raw.githubusercontent.com/hydraponique/roscomvpn-geoip/refs/heads/release/text/private.txt
      WHITELIST_URL: https://raw.githubusercontent.com/kirilllavrov/whitelists/refs/heads/main/release/IP-whitelist.txt
      MAX_SOURCE_AGE_DAYS: 120

    steps:
      # ============================
      # Checkout source with GH_PAT
      # ============================
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          ref: main

      - name: Checkout v2fly/geoip
        uses: actions/checkout@v6
        with:
          repository: v2fly/geoip
          path: geoip
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geoip/go.mod
          cache: false

      # ============================
      # Download input lists
      # ============================
      - name: Download input lists
        working-directory: geoip
        run: |
          set -euo pipefail
          CURL="curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused"
          $CURL -o direct.txt "$DIRECT_URL"
          $CURL -o private.txt "$PRIVATE_URL"
          $CURL -o IP-whitelist.txt "$WHITELIST_URL"

      # ============================
      # Copy config.json (with wantedList)
      # ============================
      - name: Copy config.json
        run: |
          cp -f config.json geoip/config.json

      - name: Build geoip tool
        working-directory: geoip
        run: |
          set -euo pipefail
          go mod download
          go build -o geoip

      - name: Validate inputs and record provenance
        run: |
          set -euo pipefail
          python3 scripts/validate_inputs.py geoip \
            "direct.txt=$DIRECT_URL" \
            "private.txt=$PRIVATE_URL" \
            "IP-whitelist.txt=$WHITELIST_URL" \
            --min-lines direct.txt=20000 \
            --min-lines private.txt=10 \
            --min-lines IP-whitelist.txt=1000

      # Свежесть источников проверяется отдельно и только предупреждением:
      # недоступность GitHub API или устаревший, но рабочий список не должны ломать сборку.
      - name: Check source freshness (advisory)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          check() {
            repo="$1"; path="$2"; branch="$3"
            changed="$(gh api "repos/$repo/commits?path=$path&sha=$branch&per_page=1" \
              --jq '.[0].commit.committer.date' 2>/dev/null || true)"
            if [ -z "$changed" ]; then
              echo "::warning::$repo/$path: не удалось определить дату последнего изменения"
              return 0
            fi
            age=$(( ( $(date -u +%s) - $(date -u -d "$changed" +%s) ) / 86400 ))
            echo "$repo/$path: изменён $changed, возраст $age дн."
            if [ "$age" -gt "$MAX_SOURCE_AGE_DAYS" ]; then
              echo "::warning::$repo/$path не обновлялся $age дн. (порог $MAX_SOURCE_AGE_DAYS дн.)"
            fi
          }
          check hydraponique/roscomvpn-geoip text/direct.txt release
          check hydraponique/roscomvpn-geoip text/private.txt release
          check kirilllavrov/whitelists release/IP-whitelist.txt main

      - name: Generate geoip artifacts
        working-directory: geoip
        run: |
          set -euo pipefail
          rm -rf output
          ./geoip -c config.json
          ls -l output/dat/*.dat

      # ============================
      # Prepare temp release files
      # ============================
      - name: Prepare temp release files
        run: |
          mkdir -p /tmp/geoip-release
          cp geoip/output/dat/geoip.dat /tmp/geoip-release/geoip.dat
          cp geoip/sources.json /tmp/geoip-release/sources.json
          sha256sum /tmp/geoip-release/geoip.dat | awk '{print $1}' > /tmp/geoip-release/geoip.dat.sha256sum

      # ============================
      # Publish to release branch
      # ============================
      - name: Publish to release branch
        id: publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin

          if git show-ref --verify --quiet refs/heads/release; then
            git checkout release
          elif git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout -b release origin/release
          else
            git checkout --orphan release
          fi

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx

          cp /tmp/geoip-release/geoip.dat ./geoip.dat
          cp /tmp/geoip-release/geoip.dat.sha256sum ./geoip.dat.sha256sum
          cp /tmp/geoip-release/sources.json ./sources.json

          git add geoip.dat geoip.dat.sha256sum sources.json

          if ! git diff --staged --quiet; then
            git commit -m "build: update geoip files ($(date +%Y-%m-%d))"
            git push origin HEAD:release --force
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Файлы без изменений"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================
      # Upload to Yandex Cloud Object Storage
      # ============================
      # Зеркало для раздачи geoip.dat из РФ: бакет Object Storage (S3 API).
      # Нужны секреты YC_S3_KEY_ID и YC_S3_SECRET — Key ID и Secret статического
      # ключа сервисного аккаунта с ролью storage.uploader (только запись).
      - name: Check Yandex Object Storage secrets
        if: steps.publish.outputs.changed == 'true'
        env:
          YC_S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.YC_S3_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${YC_S3_KEY_ID:-}" ] || [ -z "${YC_S3_SECRET:-}" ]; then
            echo "::error::Нужны секреты YC_S3_KEY_ID и YC_S3_SECRET."
            echo "::error::Добавьте их в Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Секреты найдены."

      - name: Upload geoip files to Yandex Object Storage
        if: steps.publish.outputs.changed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
          BUCKET: flyz-cryp-olxn-mojw
          OBJECT_PREFIX: geofiles
          ENDPOINT: https://storage.yandexcloud.net
        run: |
          set -euo pipefail

          # Выгружаем копии из /tmp, а не файлы из рабочего дерева: ветка release
          # к этому шагу уже опубликована, и содержимое рабочей директории больше
          # не является источником истины.
          aws s3 cp /tmp/geoip-release/geoip.dat "s3://${BUCKET}/${OBJECT_PREFIX}/geoip.dat" \
            --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp /tmp/geoip-release/geoip.dat.sha256sum \
            "s3://${BUCKET}/${OBJECT_PREFIX}/geoip.dat.sha256sum" \
            --endpoint-url "$ENDPOINT" --content-type text/plain --only-show-errors

          URL="https://storage.yandexcloud.net/${BUCKET}/${OBJECT_PREFIX}"
          echo "Объект обновлён: ${URL}/geoip.dat"
          {
            echo "### Зеркало Yandex Object Storage"
            echo ""
            echo "- dat: \`${URL}/geoip.dat\`"
            echo "- sha256: \`$(cat /tmp/geoip-release/geoip.dat.sha256sum)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================
      # Sync jsDelivr cache for @release
      # ============================
      - name: Sync jsDelivr cache
        if: steps.publish.outputs.changed == 'true'
        run: |
          set -uo pipefail
          RAW="https://raw.githubusercontent.com/kirilllavrov/geoip-builder/release/geoip.dat"
          CDN="https://cdn.jsdelivr.net/gh/kirilllavrov/geoip-builder@release/geoip.dat"
          PURGE="https://purge.jsdelivr.net/gh/kirilllavrov/geoip-builder@release/geoip.dat"
          EXPECTED="$(cat /tmp/geoip-release/geoip.dat.sha256sum)"

          # 1. Ждём, пока origin (GitHub raw) начнёт отдавать новый файл.
          #    Purge раньше этого закэширует устаревшую версию ещё на 12 часов.
          RAW_OK=0
          for i in $(seq 1 20); do
            ACTUAL="$(curl -fsSL -H 'Cache-Control: no-cache' "$RAW" | sha256sum | awk '{print $1}')"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "✅ raw отдаёт актуальный файл (проверка $i)"
              RAW_OK=1
              break
            fi
            echo "⏳ raw ещё отдаёт старую версию ($ACTUAL), ждём..."
            sleep 15
          done

          if [ "$RAW_OK" -ne 1 ]; then
            echo "⚠️ GitHub raw не отдал новый файл — purge пропущен, кэш CDN обновится сам (s-maxage=12ч)"
            exit 0
          fi

          # 2. Если CDN уже отдаёт актуальный файл — purge не нужен.
          ACTUAL="$(curl -fsSL "$CDN" | sha256sum | awk '{print $1}')"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "✅ jsDelivr уже отдаёт актуальный файл, purge не требуется"
            exit 0
          fi
          echo "CDN отдаёт $ACTUAL, требуется purge"

          # 3. Сбрасываем кэш CDN с проверкой результата.
          #    jsDelivr троттлит частые purge — при троттлинге повторять бессмысленно.
          for i in 1 2 3; do
            curl -fsSL "$PURGE" > /tmp/purge.json || echo "⚠️ purge API недоступен"
            if grep -q '"throttled": *true' /tmp/purge.json 2>/dev/null; then
              echo "⚠️ purge throttled, повторные попытки бесполезны:"
              cat /tmp/purge.json
              break
            fi
            sleep 20
            ACTUAL="$(curl -fsSL "$CDN" | sha256sum | awk '{print $1}')"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "✅ jsDelivr отдаёт актуальный файл (попытка $i)"
              curl -fsSL "https://purge.jsdelivr.net/gh/kirilllavrov/geoip-builder@release/geoip.dat.sha256sum" > /dev/null || true
              exit 0
            fi
            echo "⏳ jsDelivr ещё отдаёт старую версию ($ACTUAL), попытка $i"
            sleep 20
          done

          echo "⚠️ jsDelivr не обновился за отведённое время (кэш ветки до 12ч)."
          echo "   Актуальный файл без кэша: https://raw.githubusercontent.com/kirilllavrov/geoip-builder/release/geoip.dat"
          echo "   Зеркало jsDelivr без устаревшего кэша: https://gcore.jsdelivr.net/gh/kirilllavrov/geoip-builder@release/geoip.dat"

      - name: Set release tag
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "TAG=v$(date +%Y%m%d)-$RUN_NUMBER" >> "$GITHUB_ENV"

      # ============================
      # Restore files for GitHub Release
      # ============================
      - name: Restore files for GitHub Release
        if: steps.publish.outputs.changed == 'true'
        run: |
          mkdir -p output
          cp /tmp/geoip-release/geoip.dat output/geoip.dat
          cp /tmp/geoip-release/geoip.dat.sha256sum output/geoip.dat.sha256sum
          cp /tmp/geoip-release/sources.json output/sources.json

      # ============================
      # Create GitHub Release
      # ============================
      - name: Read SHA256
        id: sha256
        if: steps.publish.outputs.changed == 'true'
        run: echo "SHA256=$(cat output/geoip.dat.sha256sum)" >> $GITHUB_ENV

      - name: Create Release
        if: steps.publish.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: GeoIP build ${{ env.TAG }}
          body: |
            Автоматическая сборка GeoIP для Xray/Sing-box

            🔄 Run: #${{ github.run_number }}
            🔗 Commit: ${{ github.sha }}

            📦 Форматы:
            - geoip.dat (V2Ray/Xray)
            - sources.json (источники и sha256 входных списков)

            🌐 jsDelivr CDN:
            ```
            https://cdn.jsdelivr.net/gh/kirilllavrov/geoip-builder@release/geoip.dat
            ```
            🔑 SHA256:
            ```
            ${{ env.SHA256 }}
            ```
          files: |
            output/geoip.dat
            output/geoip.dat.sha256sum
            output/sources.json
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Return to main branch
        run: |
          git checkout main
